[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tft-theory-lab"
version = "0.1.0"
description = "Patch-aware TFT off-meta reroll discovery engine"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "fastapi>=0.110,<1",
  "uvicorn>=0.30,<1",
  # IANA time zones for the patch calendar's America/Los_Angeles arithmetic;
  # Windows has no system zone database (zoneinfo needs this package there).
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "Pillow>=10"]
# Only needed to run `tftlab refresh-game-art`; serving the cached art needs nothing extra.
art = ["Pillow>=10"]
postgres = ["psycopg[binary]>=3.1,<4"]

[project.scripts]
tftlab = "tftlab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tftlab = ["web/*.html", "web/static/*", "web/static/game/*/*.png", "data/*.json", "collector_web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
