name: CommunityDragon live smoke test

# Intentionally has no `push`/`pull_request` trigger: this hits the real
# raw.communitydragon.org feed, so it must never gate normal PR/unit-test CI.
# A CommunityDragon outage should only fail this workflow, not block merges.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 7 * * *" # nightly

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run live CommunityDragon smoke test
        env:
          TFTLAB_LIVE_CDRAGON_TEST: "1"
        run: pytest tests/test_cdragon_live.py -v
