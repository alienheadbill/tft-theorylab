name: Temporary prepared Discovery production verification

on:
  push:
    branches:
      - ops/verify-prepared-discovery-prod

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify prepared status and measure warm production requests
        env:
          URL: https://tft-theory-lab-ohio.onrender.com/api/discovery?costs=1%2C2%2C3&min_samples=10&top_n=5&limit=200
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --connect-timeout 20 --max-time 180 "$URL" -o first.json
          python - <<'PY'
          import json
          body = json.load(open("first.json"))
          prepared = body.get("prepared") or {}
          print("prepared.status =", prepared.get("status"))
          print("prepared.source_matches =", prepared.get("source_matches"))
          print("candidates =", len(body.get("candidates") or []))
          print("window_carries =", body.get("window_carries"))
          if prepared.get("status") != "current":
              raise SystemExit("Discovery is not serving a current prepared run")
          PY
          echo "Warm request times:"
          for i in 1 2 3 4 5; do
            curl --fail-with-body --silent --show-error --connect-timeout 20 --max-time 180               -o /dev/null -w "sample $i: %{time_total}s\n" "$URL"
          done
