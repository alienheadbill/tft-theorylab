name: Temporary production performance measurement

on:
  push:
    branches:
      - ops/perf-measure-20260930

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Measure production API critical paths
        env:
          BASE: https://tft-theory-lab-ohio.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import statistics
          import time
          import urllib.request

          base = os.environ["BASE"]
          endpoints = {
              "health": "/api/health",
              "windows": "/api/balance-windows",
              "champions": "/api/champions",
              "khazix": "/api/champions/khazix?top_n=6",
              "experiments": "/api/experiments",
              "discovery": "/api/discovery?costs=1,2,3&min_samples=10&top_n=5&limit=200",
          }

          def fetch(path):
              start = time.perf_counter()
              with urllib.request.urlopen(base + path, timeout=180) as response:
                  body = response.read()
                  if response.status != 200:
                      raise RuntimeError(f"{path}: HTTP {response.status}")
              elapsed = time.perf_counter() - start
              json.loads(body)
              return elapsed

          # One unrecorded warm-up for every route. This run starts immediately
          # after a Render deploy, so it measures request-time analytics without
          # intentionally waiting for the free service to sleep.
          for path in endpoints.values():
              fetch(path)

          samples = {}
          for name, path in endpoints.items():
              values = [fetch(path) for _ in range(3)]
              samples[name] = values

          med = {name: statistics.median(values) for name, values in samples.items()}
          page_paths = {
              "Discovery initial backend critical path": max(med["health"], med["windows"]) + med["discovery"],
              "Working Notes backend critical path": med["experiments"],
              "Champions directory backend critical path": med["windows"] + med["champions"],
              "Kha'Zix Investigation backend critical path": med["windows"] + max(med["champions"], med["khazix"]),
          }

          print("Production warm API timing (GitHub-hosted runner -> Render Ohio -> Neon Ohio)")
          for name, values in samples.items():
              print(
                  f"{name:12s} samples="
                  + ", ".join(f"{v:.3f}s" for v in values)
                  + f" | median={med[name]:.3f}s"
              )
          print("")
          print("Approximate page backend critical paths from endpoint medians:")
          for name, value in page_paths.items():
              print(f"{name}: {value:.3f}s")
          print("")
          print("These include runner-to-Render network latency and are not browser-render timings.")
          PY
