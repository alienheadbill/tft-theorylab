name: Temporary PR36 baseline

on:
  push:
    branches:
      - ops/pr36-ci-baseline

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -e ".[dev,postgres]"
      - name: Baseline SQLite suite
        run: pytest -q
