name: Verify Ohio production

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 38 &&
        github.event.comment.user.login == 'alienheadbill' &&
        github.event.comment.body == '/verify ohio'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: https://tft-theory-lab-ohio.onrender.com
    steps:
      - name: Verify Ohio production APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify

          fetch() {
            local path="$1"
            local out="$2"
            local timing="$3"
            curl --fail-with-body --silent --show-error \
              --retry 2 --retry-delay 1 \
              --connect-timeout 20 --max-time 180 \
              -w '%{time_total}' "${BASE}${path}" -o "${out}" > "${timing}"
          }

          paths=(
            "/api/health"
            "/api/champions"
            "/api/champions/khazix"
            "/api/discovery?max_cost=3&min_samples=10&top_n=5&limit=20"
          )

          for i in "${!paths[@]}"; do
            fetch "${paths[$i]}" "verify/${i}.json" "verify/${i}.time"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('verify/0.json').read_text())
          assert health.get('ok') is True, health
          assert health.get('demo') is False, health
          assert health.get('backend') == 'postgres', health
          assert int(health.get('matches', 0)) >= 3343, health
          assert int(health.get('participants', 0)) >= 26744, health

          champions = json.loads(Path('verify/1.json').read_text())
          assert champions.get('demo') is False, champions
          assert champions.get('backend') == 'postgres', champions
          assert champions.get('champions'), champions

          khazix = json.loads(Path('verify/2.json').read_text())
          assert khazix.get('demo') is False, khazix
          assert khazix.get('backend') == 'postgres', khazix

          discovery = json.loads(Path('verify/3.json').read_text())
          assert discovery.get('demo') is False, discovery
          assert discovery.get('backend') == 'postgres', discovery
          assert discovery.get('candidates') is not None, discovery

          print(
              f"Ohio production healthy: {health['matches']} matches / "
              f"{health['participants']} participants; champion and Discovery APIs returned live Postgres data."
          )
          PY

          {
            echo '### Ohio production verification'
            echo
            echo '- Backend: **Postgres**'
            echo '- Demo fallback: **off**'
            echo '- Health, Champion directory, Kha'\''Zix investigation, and Discovery APIs: **passed**'
            echo
            echo '| Endpoint | Request time (s) |'
            echo '|---|---:|'
            for i in "${!paths[@]}"; do
              printf '| %s | %s |\n' "${paths[$i]}" "$(cat "verify/${i}.time")"
            done
            echo
            echo 'Request timings include the GitHub runner network path and are smoke telemetry, not a controlled benchmark.'
          } >> "${GITHUB_STEP_SUMMARY}"