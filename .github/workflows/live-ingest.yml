name: Live ingest

# Manually-triggered only, on purpose: this hits the real Riot API and
# CommunityDragon and writes to the production database (via its external
# Postgres URL), so it must never run on push/pull_request, and has no
# schedule yet -- that's a deliberate follow-up milestone, not this one.
#
# Sampling is chosen per run through the inputs below: one seed count per
# rank cohort (validated in the first step, before checkout or any
# Riot/database access). Every cohort is its own input and its own report
# section -- Challenger, Grandmaster and Master are never combined -- and
# any cohort may be 0. Diamond and Platinum each cover divisions I-IV. The
# defaults keep the original conservative Challenger-only 10 x 5 run; the
# production ceiling is 100 seed players in total x 10 matches each. Seeds
# rotate through the sampling ledger (never-sampled players first), so
# repeated runs reach different players.
on:
  workflow_dispatch:
    inputs:
      challenger_seeds:
        description: "Challenger seed players (0-100)"
        type: number
        default: 10
      grandmaster_seeds:
        description: "Grandmaster seed players (0-100)"
        type: number
        default: 0
      master_seeds:
        description: "Master seed players (0-100)"
        type: number
        default: 0
      diamond_seeds:
        description: "Diamond (I-IV) seed players (0-100)"
        type: number
        default: 0
      platinum_seeds:
        description: "Platinum (I-IV) seed players (0-100)"
        type: number
        default: 0
      matches_per_player:
        description: "Recent matches read per seed player (1-10). Total seeds across all cohorts must be 1-100."
        type: number
        default: 5

# The workflow can be started against any branch from the Actions UI, but
# it must only ever run against production config from `main` -- enforced
# in "Validate production configuration" below, not just by convention.
permissions:
  contents: read

# A single fixed group serializes runs (queued, never cancelled) so two
# manually-triggered live ingests can never write to production at once.
concurrency:
  group: live-ingest-production
  cancel-in-progress: false

jobs:
  live-ingest:
    runs-on: ubuntu-latest
    # Room for a 100 x 10 run at Riot development-key rate limits.
    timeout-minutes: 60
    steps:
      # Runs before checkout/install and before any Riot or database access:
      # cheap fail-fast so a bad branch selection or missing/malformed
      # secret never gets as far as a real network call. Static messages
      # only -- never echoes RIOT_API_KEY or DATABASE_URL.
      - name: Validate production configuration
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Inputs reach the shell only as environment variables, never
          # interpolated into the script text.
          CHALLENGER_SEEDS: ${{ inputs.challenger_seeds }}
          GRANDMASTER_SEEDS: ${{ inputs.grandmaster_seeds }}
          MASTER_SEEDS: ${{ inputs.master_seeds }}
          DIAMOND_SEEDS: ${{ inputs.diamond_seeds }}
          PLATINUM_SEEDS: ${{ inputs.platinum_seeds }}
          MATCHES_PER_PLAYER: ${{ inputs.matches_per_player }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::This workflow must be run with 'main' explicitly selected as the branch (got ${GITHUB_REF})." >&2
            exit 1
          fi
          if [ -z "${RIOT_API_KEY}" ]; then
            echo "::error::RIOT_API_KEY repository secret is not set." >&2
            exit 1
          fi
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL repository secret is not set. Refusing to proceed: the CLI's local-SQLite fallback must never be used for production ingestion." >&2
            exit 1
          fi
          case "${DATABASE_URL}" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::DATABASE_URL must start with postgres:// or postgresql://." >&2
              exit 1
              ;;
          esac
          # Digits only, no leading zero (shell arithmetic would read it as
          # octal), at most three digits, then 0-100.
          check_seeds() {
            case "$2" in
              ''|*[!0-9]*|0?*|????*)
                echo "::error::$1 must be a whole number from 0 to 100." >&2
                exit 1
                ;;
            esac
            if [ "$2" -gt 100 ]; then
              echo "::error::$1 must be a whole number from 0 to 100." >&2
              exit 1
            fi
          }
          check_seeds challenger_seeds "${CHALLENGER_SEEDS}"
          check_seeds grandmaster_seeds "${GRANDMASTER_SEEDS}"
          check_seeds master_seeds "${MASTER_SEEDS}"
          check_seeds diamond_seeds "${DIAMOND_SEEDS}"
          check_seeds platinum_seeds "${PLATINUM_SEEDS}"
          TOTAL_SEEDS=$(( CHALLENGER_SEEDS + GRANDMASTER_SEEDS + MASTER_SEEDS + DIAMOND_SEEDS + PLATINUM_SEEDS ))
          if [ "${TOTAL_SEEDS}" -lt 1 ] || [ "${TOTAL_SEEDS}" -gt 100 ]; then
            echo "::error::Total seed players across all cohorts must be from 1 to 100 (got ${TOTAL_SEEDS})." >&2
            exit 1
          fi
          case "${MATCHES_PER_PLAYER}" in
            ''|*[!0-9]*)
              echo "::error::matches_per_player must be a whole number from 1 to 10." >&2
              exit 1
              ;;
          esac
          if [ "${MATCHES_PER_PLAYER}" -lt 1 ] || [ "${MATCHES_PER_PLAYER}" -gt 10 ]; then
            echo "::error::matches_per_player must be a whole number from 1 to 10." >&2
            exit 1
          fi
          echo "Production configuration looks valid."
          echo "Planned seed cohorts: challenger=${CHALLENGER_SEEDS} grandmaster=${GRANDMASTER_SEEDS} master=${MASTER_SEEDS} diamond=${DIAMOND_SEEDS} platinum=${PLATINUM_SEEDS} (total ${TOTAL_SEEDS})"
          echo "Planned histories: ${MATCHES_PER_PLAYER} matches per seed player."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with Postgres support
        run: pip install -e ".[dev,postgres]"

      # Each CLI command below already exits non-zero on the failure it
      # owns (invalid/expired key, CommunityDragon unreachable, unopenable
      # database, severe integrity issues), and a failed step stops the
      # job here -- no extra continue-on-error/if-guards needed. A handful
      # of individual Riot match-fetch failures during ingestion do NOT
      # fail this step: `ingest_ladder` counts those in `failed_requests`
      # and keeps going, which is existing, unchanged behavior.
      - name: Verify Riot API
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          TFT_PLATFORM: na1
          TFT_REGION: americas
        run: tftlab verify-riot

      - name: Ingest live sample
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TFT_PLATFORM: na1
          TFT_REGION: americas
          CHALLENGER_SEEDS: ${{ inputs.challenger_seeds }}
          GRANDMASTER_SEEDS: ${{ inputs.grandmaster_seeds }}
          MASTER_SEEDS: ${{ inputs.master_seeds }}
          DIAMOND_SEEDS: ${{ inputs.diamond_seeds }}
          PLATINUM_SEEDS: ${{ inputs.platinum_seeds }}
          MATCHES_PER_PLAYER: ${{ inputs.matches_per_player }}
        # Sizes were bounds-checked in "Validate production configuration".
        # --current-trusted-window: each seed's history request is bounded to
        # the current verified+sourced patch window in
        # tftlab.unreal_patch.UNREAL_PATCH_REGISTRY (Riot startTime/endTime),
        # so the run doesn't spend requests on older patches; the step fails
        # rather than crawling unbounded history if no such window is current.
        # Seeds are chosen deterministically per cohort from ladder standing
        # and the sampling ledger (tftlab.sampling), never by champion, comp,
        # placement or performance. No --allow-degraded-costs: if
        # CommunityDragon can't be reached, this must fail rather than
        # silently ingesting rarity+1 fallback costs as if authoritative.
        run: |
          tftlab ingest-riot --challenger-seeds "${CHALLENGER_SEEDS}" --grandmaster-seeds "${GRANDMASTER_SEEDS}" --master-seeds "${MASTER_SEEDS}" --diamond-seeds "${DIAMOND_SEEDS}" --platinum-seeds "${PLATINUM_SEEDS}" --matches-per-player "${MATCHES_PER_PLAYER}" --current-trusted-window

      - name: Validate ingested data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: tftlab validate-live-data

      - name: Run discovery smoke test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: tftlab discovery-smoke
