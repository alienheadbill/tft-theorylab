name: Live ingest

# Hits the real Riot API and CommunityDragon and writes to the production
# database (via its external Postgres URL), so it must never run on
# push/pull_request. It runs in two ways, through the SAME steps:
#
# - schedule: every 6 hours (UTC, below) with FIXED conservative settings
#   -- bounded mode, 15/15/20/25/25 seeds (Challenger/Grandmaster/Master/
#   Diamond/Platinum) x 10 matches each, the configuration of the two
#   successful production runs 36286242686 and 36289198154 (about 600-730
#   Riot requests and 15-20 minutes each). Dispatch inputs never apply to a
#   scheduled run. Scheduled runs are bounded, not maximum: both production
#   maximum-mode runs so far failed with 401 during deep Diamond/Platinum
#   ladder enumeration, before any match was collected.
# - workflow_dispatch: the operator inputs below, unchanged.
# - issue_comment: owner-only `/ingest smoke` on Ops Control issue #38,
#   fixed at 3 Challenger seeds x 3 matches for a bounded post-cutover smoke.
#
# With the Riot development key (it expires about every 24 hours), a
# scheduled run after expiry fails at the Riot key check, before anything
# is ingested; a key that expires mid-run fails the ingest (401/403 are
# fatal) with no seed-ledger or provenance progress for that run. Either
# way the run is red, and the next scheduled run after the RIOT_API_KEY
# secret is replaced collects normally.
#
# Sampling is chosen per run through the inputs below: one seed count per
# rank cohort (validated in the first step, before checkout or any
# Riot/database access). Every cohort is its own input and its own report
# section -- Challenger, Grandmaster and Master are never combined -- and
# any cohort may be 0. Diamond and Platinum each cover divisions I-IV. The
# defaults keep the original conservative Challenger-only 10 x 5 run; the
# production ceiling is 100 seed players in total x 10 matches each. Seeds
# rotate through the sampling ledger (never-sampled players first), so
# repeated runs reach different players.
#
# collection_mode=maximum (opt-in, never the default) ignores the seed and
# matches inputs: it enumerates all five cohorts, reads every seed's history
# inside the current trusted window to exhaustion, breadth-first, and stops
# cleanly at the first of three explicit budgets (minutes, Riot requests,
# match-detail fetches). Each wave of seeds is finalized as its own ingest
# run, so a stopped or failed run loses at most one wave's bookkeeping and
# the next dispatch continues the rotation. Nothing here dispatches another
# run or retries a run; the schedule only starts fresh, independent runs.
on:
  schedule:
    # 00:41, 06:41, 12:41 and 18:41 UTC. Off the hour on purpose: GitHub
    # delays (and can drop) scheduled runs at busy top-of-hour times.
    # Scheduled workflows run from the default branch (main) only.
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      challenger_seeds:
        description: "Challenger seed players (0-100)"
        type: number
        default: 10
      grandmaster_seeds:
        description: "Grandmaster seed players (0-100)"
        type: number
        default: 0
      master_seeds:
        description: "Master seed players (0-100)"
        type: number
        default: 0
      diamond_seeds:
        description: "Diamond (I-IV) seed players (0-100)"
        type: number
        default: 0
      platinum_seeds:
        description: "Platinum (I-IV) seed players (0-100)"
        type: number
        default: 0
      matches_per_player:
        description: "Recent matches read per seed player (1-10). Total seeds across all cohorts must be 1-100."
        type: number
        default: 5
      collection_mode:
        description: "bounded = the seed/matches inputs above; maximum = exhaust all cohorts within the budgets below"
        type: choice
        options:
          - bounded
          - maximum
        default: bounded
      max_duration_minutes:
        description: "Maximum mode only: wall-clock budget in minutes (1-200)"
        type: number
        default: 60
      max_requests:
        description: "Maximum mode only: Riot request budget (1-12000)"
        type: number
        default: 3000
      max_match_fetches:
        description: "Maximum mode only: match-detail fetch budget (0-12000)"
        type: number
        default: 2000

  issue_comment:
    types: [created]

# The workflow can be started against any branch from the Actions UI, but
# it must only ever run against production config from `main` -- enforced
# in "Validate production configuration" below, not just by convention.
permissions:
  contents: read

# A single fixed group serializes runs (queued, never cancelled) so two
# live ingests -- scheduled or manual, in any combination -- can never
# write to production at once.
jobs:
  live-ingest:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 38 &&
        github.event.comment.user.login == 'alienheadbill' &&
        github.event.comment.body == '/ingest smoke'
      )
    concurrency:
      group: live-ingest-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Bounded: room for a 100 x 10 run at Riot development-key rate limits.
    # Maximum: the ingest step stops itself at max_duration_minutes (at most
    # 200, validated below); 240 leaves room for install, verify-riot,
    # validation and the smoke test, and is the hard backstop if anything
    # hangs. Both stay well under GitHub's 360-minute job limit.
    # (A scheduled run has no inputs, so it always gets the bounded 60.)
    timeout-minutes: ${{ inputs.collection_mode == 'maximum' && 240 || 60 }}
    # Effective run settings, resolved once for every step. A scheduled run
    # uses the fixed values after `&&` (none may be 0 or empty: `&&`/`||`
    # would then fall through to the empty dispatch input); a manual run
    # uses its dispatch inputs exactly as before. Inputs reach the shell
    # only as these environment variables, never interpolated into a
    # script. The maximum-mode budgets are unused by a bounded run but
    # still validated by the preflight.
    env:
      RUN_TRIGGER: ${{ github.event_name }}
      CHALLENGER_SEEDS: ${{ github.event_name == 'schedule' && '15' || github.event_name == 'issue_comment' && '3' || inputs.challenger_seeds }}
      GRANDMASTER_SEEDS: ${{ github.event_name == 'schedule' && '15' || github.event_name == 'issue_comment' && '0' || inputs.grandmaster_seeds }}
      MASTER_SEEDS: ${{ github.event_name == 'schedule' && '20' || github.event_name == 'issue_comment' && '0' || inputs.master_seeds }}
      DIAMOND_SEEDS: ${{ github.event_name == 'schedule' && '25' || github.event_name == 'issue_comment' && '0' || inputs.diamond_seeds }}
      PLATINUM_SEEDS: ${{ github.event_name == 'schedule' && '25' || github.event_name == 'issue_comment' && '0' || inputs.platinum_seeds }}
      MATCHES_PER_PLAYER: ${{ github.event_name == 'schedule' && '10' || github.event_name == 'issue_comment' && '3' || inputs.matches_per_player }}
      COLLECTION_MODE: ${{ github.event_name == 'schedule' && 'bounded' || github.event_name == 'issue_comment' && 'bounded' || inputs.collection_mode }}
      MAX_DURATION_MINUTES: ${{ github.event_name == 'schedule' && '60' || github.event_name == 'issue_comment' && '60' || inputs.max_duration_minutes }}
      MAX_REQUESTS: ${{ github.event_name == 'schedule' && '3000' || github.event_name == 'issue_comment' && '3000' || inputs.max_requests }}
      MAX_MATCH_FETCHES: ${{ github.event_name == 'schedule' && '2000' || github.event_name == 'issue_comment' && '2000' || inputs.max_match_fetches }}
    steps:
      # Runs before checkout/install and before any Riot or database access:
      # cheap fail-fast so a bad branch selection or missing/malformed
      # secret never gets as far as a real network call. Static messages
      # only -- never echoes RIOT_API_KEY or the Neon production DATABASE_URL.
      - name: Validate production configuration
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          case "${RUN_TRIGGER}" in
            schedule)
              echo "Trigger: scheduled run -- fixed conservative settings; dispatch inputs do not apply." ;;
            workflow_dispatch)
              echo "Trigger: manual dispatch -- operator inputs." ;;
            issue_comment)
              echo "Trigger: owner-only Ops Control smoke -- fixed 3 Challenger seeds x 3 matches." ;;
            *)
              echo "::error::Unexpected trigger '${RUN_TRIGGER}': only schedule, workflow_dispatch, and the guarded issue-comment smoke may run this workflow." >&2
              exit 1
              ;;
          esac
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::This workflow must be run with 'main' explicitly selected as the branch (got ${GITHUB_REF})." >&2
            exit 1
          fi
          if [ -z "${RIOT_API_KEY}" ]; then
            echo "::error::RIOT_API_KEY repository secret is not set." >&2
            exit 1
          fi
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::NEON_DATABASE_URL repository secret is not set. Refusing to proceed: the CLI's local-SQLite fallback must never be used for production ingestion." >&2
            exit 1
          fi
          case "${DATABASE_URL}" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::DATABASE_URL must start with postgres:// or postgresql://." >&2
              exit 1
              ;;
          esac
          # Digits only, no leading zero (shell arithmetic would read it as
          # octal), at most three digits, then 0-100.
          check_seeds() {
            case "$2" in
              ''|*[!0-9]*|0?*|????*)
                echo "::error::$1 must be a whole number from 0 to 100." >&2
                exit 1
                ;;
            esac
            if [ "$2" -gt 100 ]; then
              echo "::error::$1 must be a whole number from 0 to 100." >&2
              exit 1
            fi
          }
          check_seeds challenger_seeds "${CHALLENGER_SEEDS}"
          check_seeds grandmaster_seeds "${GRANDMASTER_SEEDS}"
          check_seeds master_seeds "${MASTER_SEEDS}"
          check_seeds diamond_seeds "${DIAMOND_SEEDS}"
          check_seeds platinum_seeds "${PLATINUM_SEEDS}"
          TOTAL_SEEDS=$(( CHALLENGER_SEEDS + GRANDMASTER_SEEDS + MASTER_SEEDS + DIAMOND_SEEDS + PLATINUM_SEEDS ))
          if [ "${TOTAL_SEEDS}" -lt 1 ] || [ "${TOTAL_SEEDS}" -gt 100 ]; then
            echo "::error::Total seed players across all cohorts must be from 1 to 100 (got ${TOTAL_SEEDS})." >&2
            exit 1
          fi
          case "${MATCHES_PER_PLAYER}" in
            ''|*[!0-9]*)
              echo "::error::matches_per_player must be a whole number from 1 to 10." >&2
              exit 1
              ;;
          esac
          if [ "${MATCHES_PER_PLAYER}" -lt 1 ] || [ "${MATCHES_PER_PLAYER}" -gt 10 ]; then
            echo "::error::matches_per_player must be a whole number from 1 to 10." >&2
            exit 1
          fi
          # Whole number, no leading zero, at most five digits, then min-max.
          check_range() {
            case "$2" in
              ''|*[!0-9]*|0?*|??????*)
                echo "::error::$1 must be a whole number from $3 to $4." >&2
                exit 1
                ;;
            esac
            if [ "$2" -lt "$3" ] || [ "$2" -gt "$4" ]; then
              echo "::error::$1 must be a whole number from $3 to $4." >&2
              exit 1
            fi
          }
          case "${COLLECTION_MODE}" in
            bounded|maximum) ;;
            *)
              echo "::error::collection_mode must be bounded or maximum." >&2
              exit 1
              ;;
          esac
          check_range max_duration_minutes "${MAX_DURATION_MINUTES}" 1 200
          check_range max_requests "${MAX_REQUESTS}" 1 12000
          check_range max_match_fetches "${MAX_MATCH_FETCHES}" 0 12000
          echo "Production configuration looks valid."
          if [ "${COLLECTION_MODE}" = "maximum" ]; then
            echo "Collection mode: maximum (all five cohorts, histories exhausted inside the current trusted window)."
            echo "Budgets: ${MAX_DURATION_MINUTES} minutes, ${MAX_REQUESTS} Riot requests, ${MAX_MATCH_FETCHES} match-detail fetches."
            echo "The seed and matches_per_player inputs are ignored in maximum mode."
          else
            echo "Collection mode: bounded."
            echo "Planned seed cohorts: challenger=${CHALLENGER_SEEDS} grandmaster=${GRANDMASTER_SEEDS} master=${MASTER_SEEDS} diamond=${DIAMOND_SEEDS} platinum=${PLATINUM_SEEDS} (total ${TOTAL_SEEDS})"
            echo "Planned histories: ${MATCHES_PER_PLAYER} matches per seed player."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with Postgres support
        run: pip install -e ".[dev,postgres]"

      # Each CLI command below already exits non-zero on the failure it
      # owns (invalid/expired key, CommunityDragon unreachable, unopenable
      # database, severe integrity issues), and a failed step stops the
      # job here -- no extra continue-on-error/if-guards needed. A handful
      # of individual Riot match-fetch failures during ingestion do NOT
      # fail this step: `ingest_ladder` counts those in `failed_requests`
      # and keeps going, which is existing, unchanged behavior.
      - name: Verify Riot API
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          TFT_PLATFORM: na1
          TFT_REGION: americas
        run: tftlab verify-riot

      - name: Ingest live sample
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TFT_PLATFORM: na1
          TFT_REGION: americas
          # Operator policy cap per routing host, applied on top of the
          # limits Riot advertises in its response headers (which the
          # client paces to at 90%). Riot's API Terms cap Development keys
          # at 10 calls per 10 seconds; the key's type is not verified from
          # here, so the cap stays until a reviewed change confirms the key
          # is a Personal or Production key. Deliberately not an input.
          RIOT_RATE_CEILING: "10:10"
        # Sizes and budgets were bounds-checked in "Validate production
        # configuration".
        # --current-trusted-window: each seed's history request is bounded to
        # the current verified+sourced patch window in
        # tftlab.unreal_patch.UNREAL_PATCH_REGISTRY (Riot startTime/endTime),
        # so the run doesn't spend requests on older patches; the step fails
        # rather than crawling unbounded history if no such window is current.
        # Seeds are chosen deterministically per cohort from ladder standing
        # and the sampling ledger (tftlab.sampling), never by champion, comp,
        # placement or performance. No --allow-degraded-costs: if
        # CommunityDragon can't be reached, this must fail rather than
        # silently ingesting rarity+1 fallback costs as if authoritative.
        # Aggregate telemetry (no ids, no secrets) goes to an artifact.
        run: |
          if [ "${COLLECTION_MODE}" != "maximum" ]; then
            tftlab ingest-riot --challenger-seeds "${CHALLENGER_SEEDS}" --grandmaster-seeds "${GRANDMASTER_SEEDS}" --master-seeds "${MASTER_SEEDS}" --diamond-seeds "${DIAMOND_SEEDS}" --platinum-seeds "${PLATINUM_SEEDS}" --matches-per-player "${MATCHES_PER_PLAYER}" --current-trusted-window --rate-ceiling "${RIOT_RATE_CEILING}" --telemetry-out ingest-telemetry/telemetry.json
          else
            tftlab ingest-riot --collection-mode maximum --current-trusted-window --max-duration-minutes "${MAX_DURATION_MINUTES}" --max-requests "${MAX_REQUESTS}" --max-match-fetches "${MAX_MATCH_FETCHES}" --rate-ceiling "${RIOT_RATE_CEILING}" --telemetry-out ingest-telemetry/telemetry.json
          fi

      - name: Upload collection telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-telemetry
          path: ingest-telemetry/
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate ingested data
        id: validate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: tftlab validate-live-data

      - name: Run discovery smoke test
        id: smoke
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: tftlab discovery-smoke

      # One short table per run on the run's summary page, so a scheduled
      # run can be judged at a glance (the full report stays in the ingest
      # step's log and the ingest-telemetry artifact). Reads only the
      # aggregate telemetry file -- no ids, no secrets -- and never fails
      # the job itself.
      - name: Summarize collection
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}" || true
          import json, os
          env = os.environ
          print("## Live ingest collection summary\n")
          print(f"- Trigger: `{env.get('RUN_TRIGGER', '?')}`; mode: `{env.get('COLLECTION_MODE', '?')}`")
          try:
              with open("ingest-telemetry/telemetry.json") as f:
                  t = json.load(f)
          except (OSError, ValueError):
              print("- Ingest did not produce telemetry: the run stopped before ingestion "
                    "(see the first failed step, e.g. Verify Riot API for an expired key).")
              t = None
          if t is not None:
              c, r = t.get("collection") or {}, t.get("riot") or {}
              pair = lambda a, b: f"{c.get(a, 'n/a')} / {c.get(b, 'n/a')}"
              print(f"- Outcome: `{t.get('outcome')}`; run id: `{t.get('run_id')}`\n")
              print("| Metric | Value |\n|---|---|")
              for label, value in (
                  ("Matches inserted (new)", c.get("matches_inserted")),
                  ("Already stored, skipped before fetch", c.get("duplicates_skipped")),
                  ("Match-detail fetches", c.get("matches_fetched")),
                  ("Non-ranked matches skipped", c.get("non_target_matches_skipped")),
                  ("Failed match requests", c.get("failed_requests")),
                  ("Seeds (sampled / requested)", pair("seed_players", "requested_seeds")),
                  ("Failed / empty seed histories", pair("failed_history_requests", "seeds_with_empty_history")),
                  ("Seed ledger rows finalized", c.get("seed_ledger_rows")),
                  ("Provenance rows finalized", c.get("discovery_rows")),
                  ("Riot requests (total)", r.get("requests")),
                  ("Riot responses by status", r.get("by_status")),
                  ("Riot 429s", r.get("rate_limited")),
                  ("Ingest elapsed (s)", r.get("elapsed_s")),
              ):
                  print(f"| {label} | {'n/a' if value is None else value} |")
          print(f"\n- Validate ingested data: `{env.get('VALIDATE_OUTCOME') or 'not run'}`; "
                f"discovery smoke: `{env.get('SMOKE_OUTCOME') or 'not run'}`")
          PY
