services:
  - type: web
    name: tft-theory-lab
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -e ".[postgres]"
    startCommand: uvicorn tftlab.webapp:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TFT_PLATFORM
        value: na1
      - key: TFT_REGION
        value: americas
      - key: TFT_DB_PATH
        value: data/tftlab.sqlite3
      - key: RIOT_API_KEY
        sync: false
      # Production uses the Neon Ohio Postgres database. Keep the credential
      # in Render's secret environment only; never commit it here.
      # Leave unset only for local/demo-style deployments.
      - key: DATABASE_URL
        sync: false
